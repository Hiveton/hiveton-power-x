<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerX OS - 功率计管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            user-select: none;
        }
        
        /* 桌面背景 */
        #desktop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #008080;
            background-image: 
                linear-gradient(45deg, #009090 25%, transparent 25%),
                linear-gradient(-45deg, #009090 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #009090 75%),
                linear-gradient(-45deg, transparent 75%, #009090 75%);
            background-size: 4px 4px;
            background-position: 0 0, 0 2px, 2px -2px, -2px 0px;
            overflow: hidden;
            font-family: "MS Sans Serif", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 桌面图标 */
        .desktop-icon {
            position: absolute;
            width: 75px;
            text-align: center;
            cursor: pointer;
            padding: 4px;
            border: 1px solid transparent;
        }
        .desktop-icon:hover {
            border: 1px dotted #c0c0c0;
        }
        .desktop-icon.selected {
            border: 1px dotted #c0c0c0;
            background: rgba(0,0,128,0.3);
        }
        .desktop-icon.selected .icon-label {
            background: #000080;
            color: white;
        }
        .icon-image {
            width: 32px;
            height: 32px;
            margin: 0 auto 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .icon-label {
            font-size: 11px;
            color: white;
            text-shadow: 1px 1px 0 #000;
            padding: 1px 2px;
            word-break: break-word;
            line-height: 1.2;
        }

        /* 窗口样式 */
        .window {
            position: absolute;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
            min-width: 200px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
        }
        .window.active {
            z-index: 1000;
        }
        .window.inactive {
            z-index: 100;
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 28px) !important;
        }

        /* 标题栏 */
        .window-titlebar {
            background: linear-gradient(to right, #808080, #a0a0a0);
            color: #c0c0c0;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            cursor: default;
        }
        .window.active .window-titlebar {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
        }
        .window-icon {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .window-title {
            flex: 1;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .window-buttons {
            display: flex;
            gap: 2px;
        }
        .win-btn {
            width: 16px;
            height: 14px;
            border: 1px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            background: #c0c0c0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: black;
            cursor: pointer;
        }
        .win-btn:active {
            border-color: #808080 #ffffff #ffffff #808080;
        }

        /* 窗口内容 */
        .window-content {
            flex: 1;
            overflow: auto;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            margin: 2px;
            background: #c0c0c0;
            padding: 2px;
        }

        /* 调整大小手柄 */
        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 16px;
            height: 16px;
            cursor: se-resize;
            background: linear-gradient(135deg, transparent 45%, #808080 45%, #808080 55%, transparent 55%),
                        linear-gradient(135deg, transparent 65%, #808080 65%, #808080 75%, transparent 75%),
                        linear-gradient(135deg, transparent 85%, #808080 85%, #808080 95%, transparent 95%);
        }
        .window.maximized .resize-handle {
            display: none;
        }

        /* 菜单栏 */
        .menubar {
            background: #c0c0c0;
            padding: 2px 4px;
            display: flex;
            gap: 8px;
            font-size: 12px;
            border-bottom: 1px solid #808080;
        }
        .menu-item {
            padding: 2px 8px;
            cursor: pointer;
        }
        .menu-item:hover {
            background: #000080;
            color: white;
        }

        /* 任务栏 */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 28px;
            background: #c0c0c0;
            border-top: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            display: flex;
            align-items: center;
            padding: 0 2px;
            z-index: 10000;
        }
        #start-btn {
            height: 22px;
            padding: 0 6px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #start-btn.active {
            border-color: #808080 #ffffff #ffffff #808080;
            box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
        }
        .taskbar-divider {
            width: 2px;
            height: 22px;
            border-left: 1px solid #808080;
            border-right: 1px solid #ffffff;
            margin: 0 4px;
        }
        #taskbar-items {
            flex: 1;
            display: flex;
            gap: 2px;
            overflow-x: auto;
            padding: 0 4px;
        }
        .taskbar-item {
            height: 22px;
            padding: 0 8px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
            max-width: 160px;
            overflow: hidden;
        }
        .taskbar-item.active {
            border-color: #808080 #ffffff #ffffff #808080;
            box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
            background: #d4d0c8;
        }
        .taskbar-item .icon {
            font-size: 14px;
        }
        .taskbar-item .text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #system-tray {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 4px;
            border: 1px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            height: 22px;
            font-size: 11px;
        }

        /* 开始菜单 */
        #start-menu {
            position: fixed;
            bottom: 28px;
            left: 2px;
            width: 200px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
            display: none;
            z-index: 10001;
        }
        #start-menu.show {
            display: block;
        }
        .start-menu-header {
            background: linear-gradient(to bottom, #000080, #1084d0);
            color: white;
            padding: 4px 8px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .start-menu-item {
            padding: 6px 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .start-menu-item:hover {
            background: #000080;
            color: white;
        }
        .start-menu-item .icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }
        .start-menu-divider {
            height: 1px;
            background: #808080;
            margin: 4px 8px;
            border-bottom: 1px solid #ffffff;
        }

        /* Win95 组件样式 */
        .outset {
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
            background: #c0c0c0;
        }
        .inset {
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
            background: #ffffff;
        }
        .win95-btn {
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
            background: #c0c0c0;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .win95-btn:active {
            border-color: #808080 #ffffff #ffffff #808080;
            box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
        }
        .win95-btn-primary {
            background: #0000ff;
            color: white;
            border-color: #5555ff #000080 #000080 #5555ff;
        }
        .win95-btn-primary:active {
            border-color: #000080 #5555ff #5555ff #000080;
        }
        .win95-btn-success {
            background: #00aa00;
            color: white;
            border-color: #00ff00 #006600 #006600 #00ff00;
        }
        .win95-btn-danger {
            background: #ff0000;
            color: white;
            border-color: #ff5555 #800000 #800000 #ff5555;
        }
        .win95-group {
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 12px;
            position: relative;
            margin-top: 8px;
        }
        .win95-group-title {
            position: absolute;
            top: -9px;
            left: 8px;
            background: #c0c0c0;
            padding: 0 4px;
            font-size: 12px;
        }
        .win95-input {
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
            background: #ffffff;
            padding: 3px 6px;
            font-size: 12px;
        }
        .win95-select {
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            background: #ffffff;
            padding: 2px 4px;
            font-size: 12px;
        }
        .lcd-display {
            background: #c0d4a0;
            border: 3px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            font-family: "Courier New", monospace;
            font-size: 20px;
            padding: 6px 12px;
            text-align: right;
            color: #000000;
        }

        /* 动画 */
        @keyframes rainbow {
            0% { color: #ff0000; }
            17% { color: #ff8000; }
            33% { color: #ffff00; }
            50% { color: #00ff00; }
            67% { color: #0080ff; }
            83% { color: #8000ff; }
            100% { color: #ff0000; }
        }
        .rainbow-text {
            animation: rainbow 3s linear infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
        .blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 16px;
            height: 16px;
        }
        ::-webkit-scrollbar-track {
            background: #d4d0c8;
            border: 2px solid #808080;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
        }
    </style>
</head>
<body>
    <!-- 桌面 -->

    <!-- 开始菜单 -->

        // 时钟更新
        function updateClock() {

            const displayHours = hours % 12 || 12;
            document.getElementById('clock').textContent = `${displayHours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 开始菜单
        document.getElementById('start-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            document.getElementById('start-menu').classList.toggle('show');
        });

        document.addEventListener('click', function() {
            document.getElementById('start-btn').classList.remove('active');
            document.getElementById('start-menu').classList.remove('show');
        });

        document.getElementById('start-menu').addEventListener('click', function(e) {
            e.stopPropagation();
        });

        // 桌面图标交互
        let selectedIcon = null;
        document.querySelectorAll('.desktop-icon').forEach(icon => {
            icon.addEventListener('click', function(e) {
                e.stopPropagation();
                if (selectedIcon) {
                    selectedIcon.classList.remove('selected');
                }
                this.classList.add('selected');
                selectedIcon = this;
            });

            icon.addEventListener('dblclick', function() {
                const app = this.dataset.app;
                const title = this.dataset.title;
                openApp(app, title);
            });
        });

        document.getElementById('desktop').addEventListener('click', function() {
            if (selectedIcon) {
                selectedIcon.classList.remove('selected');
                selectedIcon = null;
            }
        });

        // 打开应用
        function openApp(appId, customTitle) {
            const app = appContents[appId];
            if (!app) return;

            windowCount++;
            const windowId = `win-${windowCount}`;
            const title = customTitle || app.title;

            // 计算窗口位置（级联）
            const offset = (windowCount % 5) * 30;

            // 创建窗口
            const windowEl = document.createElement('div');
            windowEl.className = 'window active';
            windowEl.id = windowId;
            windowEl.style.width = app.width + 'px';
            windowEl.style.height = app.height + 'px';
            windowEl.style.left = (100 + offset) + 'px';
            windowEl.style.top = (50 + offset) + 'px';
            windowEl.style.zIndex = ++zIndexCounter;

            windowEl.innerHTML = `
                <div class="window-titlebar" onmousedown="startDrag(event, '${windowId}')">
                    <div class="window-icon">${app.icon}</div>
                    <div class="window-title">${title}</div>
                    <div class="window-buttons">
                        <div class="win-btn" onclick="minimizeWindow('${windowId}')">_</div>
                        <div class="win-btn" onclick="maximizeWindow('${windowId}')">□</div>
                        <div class="win-btn" onclick="closeWindow('${windowId}')">×</div>
                    </div>
                </div>
                <div class="window-content">${app.content}</div>
                <div class="resize-handle" onmousedown="startResize(event, '${windowId}')"></div>
            `;

            document.getElementById('windows-container').appendChild(windowEl);

            // 添加到任务栏
            const taskbarItem = document.createElement('div');
            taskbarItem.className = 'taskbar-item active outset';
            taskbarItem.id = `task-${windowId}`;
            taskbarItem.innerHTML = `<span class="icon">${app.icon}</span><span class="text">${title}</span>`;
            taskbarItem.onclick = () => focusWindow(windowId);
            document.getElementById('taskbar-items').appendChild(taskbarItem);

            // 窗口激活
            windowEl.addEventListener('mousedown', () => focusWindow(windowId));

            // 保存窗口信息
            windows[windowId] = {
                element: windowEl,
                taskbarItem: taskbarItem,
                icon: app.icon,
                title: title,
                minimized: false,
                maximized: false
            };

            activeWindow = windowId;
            updateTaskbar();

            // 初始化图表（如果有）
            setTimeout(() => {
                if (appId === 'monitor') {
                    initMonitorChart();
                } else if (appId === 'charts') {
                    initTrendChart();
                }
            }, 100);
        }

        // 窗口操作
        function closeWindow(windowId) {
            const win = windows[windowId];
            if (win) {
                win.element.remove();
                win.taskbarItem.remove();
                delete windows[windowId];
                if (activeWindow === windowId) {
                    activeWindow = null;
                }
            }
        }

        function minimizeWindow(windowId) {
            const win = windows[windowId];
            if (win) {
                win.element.style.display = 'none';
                win.minimized = true;
                win.taskbarItem.classList.remove('active');
                if (activeWindow === windowId) {
                    activeWindow = null;
                }
            }
        }

        function maximizeWindow(windowId) {
            const win = windows[windowId];
            if (win) {
                win.maximized = !win.maximized;
                if (win.maximized) {
                    win.element.classList.add('maximized');
                } else {
                    win.element.classList.remove('maximized');
                }
            }
        }

        function focusWindow(windowId) {
            const win = windows[windowId];
            if (!win) return;

            // 显示窗口
            if (win.minimized) {
                win.element.style.display = 'flex';
                win.minimized = false;
            }

            // 更新z-index
            win.element.style.zIndex = ++zIndexCounter;
            win.element.classList.add('active');
            win.element.classList.remove('inactive');
            win.taskbarItem.classList.add('active');

            // 更新其他窗口
            Object.keys(windows).forEach(id => {
                if (id !== windowId) {
                    windows[id].element.classList.remove('active');
                    windows[id].element.classList.add('inactive');
                    windows[id].taskbarItem.classList.remove('active');
                }
            });

            activeWindow = windowId;
        }

        function updateTaskbar() {
            // 任务栏更新逻辑
        }

        // 拖拽功能
        let dragWindow = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        function startDrag(e, windowId) {
            const win = windows[windowId];
            if (!win || win.maximized) return;

            dragWindow = win.element;
            const rect = dragWindow.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
            focusWindow(windowId);
        }

        function onDrag(e) {
            if (!dragWindow) return;
            dragWindow.style.left = (e.clientX - dragOffsetX) + 'px';
            dragWindow.style.top = (e.clientY - dragOffsetY) + 'px';
        }

        function stopDrag() {
            dragWindow = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // 调整大小功能
        let resizeWindow = null;
        let resizeStartX = 0;
        let resizeStartY = 0;
        let resizeStartWidth = 0;
        let resizeStartHeight = 0;

        function startResize(e, windowId) {
            const win = windows[windowId];
            if (!win) return;

            resizeWindow = win.element;
            resizeStartX = e.clientX;
            resizeStartY = e.clientY;
            resizeStartWidth = resizeWindow.offsetWidth;
            resizeStartHeight = resizeWindow.offsetHeight;

            document.addEventListener('mousemove', onResize);
            document.addEventListener('mouseup', stopResize);
            e.preventDefault();
        }

        function onResize(e) {
            if (!resizeWindow) return;
            const newWidth = resizeStartWidth + (e.clientX - resizeStartX);
            const newHeight = resizeStartHeight + (e.clientY - resizeStartY);
            resizeWindow.style.width = Math.max(200, newWidth) + 'px';
            resizeWindow.style.height = Math.max(150, newHeight) + 'px';
        }

        function stopResize() {
            resizeWindow = null;
            document.removeEventListener('mousemove', onResize);
            document.removeEventListener('mouseup', stopResize);
        }

                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { min: 0, max: 20 }
                    }
                }
            });
        }

        function startMonitor() {
            if (monitorInterval) return;
            monitorInterval = setInterval(() => {
                const voltage = (4.8 + Math.random() * 0.4).toFixed(2);
                const current = (2.0 + Math.random() * 0.8).toFixed(2);
                const power = (voltage * current).toFixed(1);

                const vd = document.getElementById('voltage-disp');
                const cd = document.getElementById('current-disp');
                const pd = document.getElementById('power-disp');

                if (vd) vd.textContent = voltage.padStart(5, '0');
                if (cd) cd.textContent = current.padStart(5, '0');
                if (pd) pd.textContent = power.padStart(6, '0');

                if (monitorChart) {
                    monitorChart.data.datasets[0].data.shift();
                    monitorChart.data.datasets[0].data.push(parseFloat(power));
                    monitorChart.update('none');
                }
            }, 100);
        }

        function stopMonitor() {
            if (monitorInterval) {
                clearInterval(monitorInterval);
                monitorInterval = null;
            }
